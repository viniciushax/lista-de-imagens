<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/resets.css">
    <link rel="stylesheet" href="/src/style.css">
    <link rel="stylesheet" href="/src/responsive.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Lista de Imagens</title>
</head>

<body>

<section class="pinturas">
    <div class="pintura">
        <img src="/imagens/rome.png" alt="pintura roma">
        <div class="informacoes">
            <h2 class="titulo">Rome</h2>
            <h3 class="subtitulo">Michelangelo</h3>
        </div>
    </div>

    <div class="pintura">
        <img src="/imagens/boat.png" alt="pintura boat">
        <div class="informacoes">
            <h2 class="titulo">Boat and Sea</h2>
            <h3 class="subtitulo">Vicente Van Gogh</h3>
        </div>
    </div>

    <div class="pintura">
        <img src="/imagens/sand-and-sea.png" alt="pintura sand">
        <div class="informacoes">
            <h2 class="titulo">Sand and Sea</h2>
            <h3 class="subtitulo">Da Vinci</h3>
        </div>
    </div>

    <div class="pintura">
        <img src="/imagens/starry-night.png" alt="pintura starry night">
        <div class="informacoes">
            <h2 class="titulo">Starry Night</h2>
            <h3 class="subtitulo">Vicent Van Gogh</h3>
